<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Order — YOUR TYPE</title>
<link rel="stylesheet" href="legal.css"><link rel="stylesheet" href="/music-player.css">
<style>
:root{color-scheme:dark}
.trackWrap{max-width:720px;margin:0 auto;padding:0 18px 60px}
.trackCard{margin-top:28px;border:1px solid #292929;background:#0b0b0b;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.trackForm{display:flex;gap:10px;margin-top:18px}.trackForm input{flex:1;min-width:0;padding:14px;background:#111;border:1px solid #333;color:#fff;outline:none}.trackForm button{padding:14px 20px;background:#f1f1f1;color:#090909;border:1px solid #f1f1f1;font-weight:700;letter-spacing:1px;cursor:pointer}
.trackMsg{margin-top:16px;color:#aaa;font-size:12px;line-height:1.6}.trackMsg.error{color:#ff9b9b}
.trackHead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid #242424;padding-bottom:18px;margin-bottom:18px}.trackHead h2{margin:0;font-size:25px}.status{padding:7px 10px;border:1px solid #444;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap}.status.delivered{border-color:#34784b;color:#8ee0a6}.status.cancelled{border-color:#7a3434;color:#ff9b9b}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:24px 0 28px}.step{position:relative;text-align:center;color:#555;font-size:9px;line-height:1.35}.step:before{content:'';display:block;width:18px;height:18px;border:1px solid #333;border-radius:50%;margin:0 auto 8px;background:#0b0b0b}.step:after{content:'';position:absolute;left:calc(50% + 9px);right:calc(-50% + 9px);top:9px;height:1px;background:#242424}.step:last-child:after{display:none}.step.done{color:#ddd}.step.done:before{content:'✓';display:grid;place-items:center;border-color:#aaa;color:#fff}.step.current{color:#fff}.step.current:before{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.infoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.info{border:1px solid #222;padding:13px}.info span{display:block;color:#666;font-size:8px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:6px}.info b{font-size:13px;color:#eee;word-break:break-word}.shipBox{margin-top:12px;border:1px solid #222;padding:14px}.shipBox span{display:block;color:#666;font-size:8px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:7px}.shipBox a{color:#fff;text-decoration:underline}.trackActions{display:flex;gap:9px;margin-top:18px}.trackActions a{padding:12px 15px;border:1px solid #333;color:#ddd;text-decoration:none;font-size:9px;letter-spacing:1px}.trackActions a.primary{background:#eee;color:#080808;border-color:#eee}
@media(max-width:600px){.trackForm{flex-direction:column}.trackForm button{width:100%}.timeline{grid-template-columns:1fr;gap:9px}.step{text-align:left;display:flex;align-items:center;gap:10px}.step:before{margin:0;width:18px;flex:none}.step:after{display:none}.infoGrid{grid-template-columns:1fr}.trackHead{flex-direction:column}.trackActions{flex-direction:column}.trackActions a{text-align:center}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><a class="logo" href="index.html">YOUR TYPE</a><a class="back" href="index.html">← SHOP</a></div>
  <div class="trackWrap">
    <div class="eyebrow">YOUR TYPE / ORDER TRACKING</div>
    <h1>Track your order.</h1>
    <p class="muted">Enter your order number to see the latest order status and shipment details.</p>
    <div class="trackCard">
      <form class="trackForm" onsubmit="event.preventDefault();track()">
        <input id="id" required placeholder="YT-..." autocomplete="off" aria-label="Order number">
        <button type="submit">TRACK ORDER →</button>
      </form>
      <div id="result" class="trackMsg" hidden></div>
    </div>
  </div>
  <footer>© 2026 YOUR TYPE · Store information — verify final business/legal details before launch.</footer>
</div>
<script>
const orderParam=new URLSearchParams(location.search).get('order');
if(orderParam)document.getElementById('id').value=orderParam;
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
const steps=['Confirmed','Packed','Shipped','Out for Delivery','Delivered'];
function render(o){
 const result=document.getElementById('result');
 const status=String(o.status||'New');
 const cancelled=status==='Cancelled';
 const orderIndex=steps.indexOf(status);
 const activeIndex=orderIndex>=0?orderIndex:(status==='Processing'?0:0);
 const timeline=cancelled
   ? '<div class="timeline"><div class="step current"><span style="display:block">Cancelled</span></div></div>'
   : '<div class="timeline">'+steps.map((s,i)=>'<div class="step '+(i<=activeIndex?'done ':'')+(i===activeIndex?'current':'')+'">'+s+'</div>').join('')+'</div>';
 const shipment=o.tracking_url
   ? '<div class="shipBox"><span>Shipment tracking</span><b>'+(o.courier||'Delivery partner')+'</b>'+(o.awb?'<div style="margin-top:5px;color:#aaa;font-size:11px">AWB: '+o.awb+'</div>':'')+'<div style="margin-top:9px"><a href="'+String(o.tracking_url).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">OPEN LIVE SHIPMENT TRACKING →</a></div></div>'
   : '<div class="shipBox"><span>Shipment tracking</span><div style="color:#888;font-size:11px">AWB / courier tracking will appear here once your order is shipped.</div></div>';
 result.className='trackMsg';result.hidden=false;
 result.innerHTML='<div class="trackHead"><div><h2>'+String(o.orderId||'Order')+'</h2><div style="color:#777;font-size:10px;margin-top:5px">'+(o.date?new Date(o.date).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'')+'</div></div><div class="status '+(cancelled?'cancelled':status==='Delivered'?'delivered':'')+'">'+status+'</div></div>'
 +timeline
 +'<div class="infoGrid"><div class="info"><span>Order total</span><b>'+money(o.total)+'</b></div><div class="info"><span>Payment</span><b>'+String(o.payment||'COD').toUpperCase()+'</b></div><div class="info"><span>AWB</span><b>'+String(o.awb||'Not assigned')+'</b></div></div>'
 +shipment
 +'<div class="trackActions"><a class="primary" href="checkout.html">SHOP MORE →</a><a href="javascript:history.back()">← BACK</a></div>';
}
async function track(){
 const id=document.getElementById('id').value.trim();const result=document.getElementById('result');if(!id)return;
 result.hidden=false;result.className='trackMsg';result.textContent='Loading tracking details…';
 try{const r=await fetch('/api/orders/'+encodeURIComponent(id)+'/track',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Order not found');render(d);}catch(e){result.className='trackMsg error';result.textContent=e.message||'Unable to load order tracking.';}
}
if(orderParam)track();
</script>
<script src="/music-player.js" defer></script>
</body></html>
